[project]
name = "echodev-api"
version = "0.1.0"
requires-python = ">=3.12"
# Same pins as requirements.txt (Vercel may read either file; a test keeps them equal).
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "anthropic==2.4.0",
    "google-genai==2.34.0",
    "firebase-admin==7.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
