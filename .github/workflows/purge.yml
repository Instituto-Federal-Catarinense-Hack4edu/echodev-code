# Deletes transcript lines older than 24 h. The free Firebase plan has no TTL, so the API route
# POST /cron/purge is called every hour. Set the repository secrets ECHODEV_API_URL (e.g.
# https://echodev-api.onrender.com) and ECHODEV_CRON_SECRET (CRON_SECRET of the API).
name: Limpeza de 24 h

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /cron/purge
        env:
          API_URL: ${{ secrets.ECHODEV_API_URL }}
          CRON_SECRET: ${{ secrets.ECHODEV_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Segredos ECHODEV_API_URL e ECHODEV_CRON_SECRET não configurados; nada a fazer."
            exit 0
          fi
          # A free Render instance may be asleep: allow time for it to wake up.
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 20 \
            -X POST "${API_URL%/}/cron/purge" -H "X-Cron-Secret: $CRON_SECRET"
